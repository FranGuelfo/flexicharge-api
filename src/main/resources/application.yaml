spring:
  data:
    mongodb:
      uri: 'mongodb+srv://${MONGO_USER}:${MONGO_PASS}@${MONGO_CLUSTER}/${MONGO_DB}?retryWrites=true&w=majority'
      auto-index-creation: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: "smtp.gmail.com"

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000

server:
  port: 8081

# Configuración personalizada de precios
billing:
  prices:
    punta: 0.50
    valle: 0.20